[project]
name = "kb"
version = "0.1.0"
description = "Cortex: ingestion pipeline, REST API and MCP server over a tagged document knowledge base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "openai>=1.55.0",
    "tiktoken>=0.8.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "mcp>=1.9.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "anthropic>=0.120.2",
    "google-genai>=2.16.0",
]

[project.scripts]
kb-seed = "kb.scripts.seed:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "PT"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kb"]
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
