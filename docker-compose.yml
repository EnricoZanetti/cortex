name: document-intelligence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kb}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kb} -d ${POSTGRES_DB:-kb}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # The Qdrant image is distroless-ish: no curl/wget, but it ships bash, so use
      # a raw TCP check against the HTTP port.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn kb.api.main:app --host 0.0.0.0 --port 8000"
    # Every tunable documented in .env.example is forwarded here, so changing a value in
    # .env actually changes the running system. Anchored and reused by the mcp service so
    # the two processes can never drift apart.
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-kb}@postgres:5432/${POSTGRES_DB:-kb}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb_chunks}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be set in .env}
      # Optional: only required when EMBEDDING_PROVIDER=openai, which the app enforces.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-800}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-120}
      CHUNK_MIN_TOKENS: ${CHUNK_MIN_TOKENS:-150}
      RETRIEVAL_CANDIDATE_POOL: ${RETRIEVAL_CANDIDATE_POOL:-40}
      RRF_K: ${RRF_K:-60}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-*}
      STORAGE_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mcp:
    build:
      context: ./backend
    command: uvicorn kb.mcp_server.server:app --host 0.0.0.0 --port 8080
    environment: *backend_env
    ports:
      - "${MCP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
  uploads:
