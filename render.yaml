# Render blueprint: deploys the API, the MCP server and the frontend as public URLs,
# with a managed Postgres. Qdrant is not offered by Render, so QDRANT_URL/QDRANT_API_KEY
# point at a Qdrant Cloud cluster (the free tier is sufficient for this workload).
#
# Deploy:
#   1. Create a Qdrant Cloud cluster; note its URL and API key.
#   2. In Render: New > Blueprint, point at this repository.
#   3. Fill the values marked sync:false when prompted (they are never committed).
#
# Both Python services run the same image with different start commands, exactly as in
# docker-compose, so local and deployed behaviour cannot diverge.
#
# Everything below runs on Render's free tier: zero cost, meant for a short-lived demo.
# Tradeoffs to know about:
#   - Free web services spin down after 15 min idle; the next request eats a ~30-50s
#     cold start while the container boots back up.
#   - kb-postgres on the free plan is deleted after 30 days; re-provision and reseed
#     if the deployment needs to outlive that.
#   - Free instances don't support persistent disks, so the uploads disk was dropped;
#     anything under STORAGE_DIR is wiped on every restart or redeploy.

databases:
  - name: kb-postgres
    databaseName: kb
    user: kb
    plan: free

services:
  - type: web
    name: kb-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    dockerCommand: >-
      sh -c "alembic upgrade head &&
             uvicorn kb.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kb-postgres, property: connectionString }
      - key: OPENAI_API_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Chat providers. Set whichever you want available; the picker greys out
      # the rest rather than failing.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Signs chat-login JWTs. Generate one: openssl rand -hex 32
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRES_MINUTES
        value: "10080"
      - key: FREE_RUNS_PER_USER
        value: "3"
      # Optional: bootstrap one admin login with unlimited free runs on your own
      # keys, to hand out for demos. Leave both unset in the dashboard to skip.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # The assistant reaches the MCP server as an ordinary client, so it needs
      # the deployed MCP service's public URL. `fromService`/`property: host` would
      # give the private-network hostname instead, but kb-mcp is a free-plan service
      # and free services can't receive private-network traffic, only send it, so
      # that hostname never resolves from kb-api. sync:false so it's filled in per
      # deploy with kb-mcp's actual public URL from the Render dashboard.
      - key: MCP_SERVER_URL
        sync: false
      # `fromService`/`property: host` yields Render's private-network hostname, which
      # never matches the browser's public Origin header, so this must be the frontend's
      # actual public URL (its custom domain, once attached).
      - key: CORS_ORIGINS
        value: "https://cortex.enricozanetti.dev"
      - key: STORAGE_DIR
        value: /data/uploads

  - type: web
    name: kb-mcp
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    dockerCommand: uvicorn kb.mcp_server.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kb-postgres, property: connectionString }
      - key: OPENAI_API_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Render terminates TLS in front of the container, so the Host header is the
      # public domain. '*' keeps the transport's DNS-rebinding check out of the way;
      # tighten it to the service's own domain once that domain is known.
      - key: MCP_ALLOWED_HOSTS
        value: "*"

  - type: web
    name: kb-frontend
    runtime: docker
    domains:
      - cortex.enricozanetti.dev
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # Baked into the client bundle at build time, so it must be the public API URL.
      # `fromService`/`property: host` yields Render's private-network hostname (not
      # publicly resolvable from a browser), so this has to be set to kb-api's actual
      # public URL, e.g. https://kb-api-<hash>.onrender.com, taken from the kb-api
      # service page in the Render dashboard. sync:false so it's filled in per-deploy.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # The image's CMD (`node server.js`) listens on whatever PORT is in its environment,
      # defaulting to 3000 per the Dockerfile. Render's proxy otherwise assumes 10000 for
      # Docker services with no explicit PORT, which misroutes every request into a 502.
      - key: PORT
        value: "3000"
