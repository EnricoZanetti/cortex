name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.18.1
        ports: ["6333:6333"]

    env:
      # CI runs against the offline embedder, so the suite needs no API key and no
      # network egress -- tests stay fast, free and deterministic.
      EMBEDDING_PROVIDER: hash
      MCP_API_KEY: ci-test-key
      DATABASE_URL: postgresql+psycopg://kb:kb@localhost:5432/kb
      QDRANT_URL: http://localhost:6333
      STORAGE_DIR: /tmp/kb-uploads
      # No MCP server runs in CI, so the chat integration tests skip themselves.
      # Everything else in the chat layer is covered without one.
      MCP_SERVER_URL: http://127.0.0.1:1/mcp

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Test (unit + integration)
        run: uv run pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
